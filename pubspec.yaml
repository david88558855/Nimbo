name: nimbo
description: "Nimbo — 多协议网盘客户端（FTP / SFTP / S3 / WebDAV / 本地），Windows + Android。"
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  crypto: ^3.0.3
  xml: ^6.5.0
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  dartssh2: ^4.1.0
  file_picker: ^8.1.0
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
