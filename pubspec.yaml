name: nimbo
description: "Nimbo — 多协议网盘客户端（FTP / SFTP / S3 / WebDAV / 本地），Windows + Android。"
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  crypto: ^3.0.3
  xml: ^6.5.0
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  dartssh2: ^4.1.0
  file_picker: ^8.1.0
  desktop_drop: ^0.8.4
  tray_manager: ^0.8.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray.ico
    - assets/tray.png
  # Windows 端界面字体：思源黑体 / Noto Sans SC（SIL OFL 1.1，见 assets/fonts/OFL.txt）。
  # Windows 不预装这个字族，所以必须随包内置，否则「指定字体」在用户机器上等于没生效。
  # 只声明 400/500/700 三个字重：本项目的字号体系用 w400 / w500 / w600 / w700 / w800，
  # 缺字重时 Flutter 会按最接近的字重匹配（w600 落到 500 或 700）。
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.otf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700
